name: Build BlackAddons

on:
  push:
    branches: [ "multiversion-26.1.2-26.2" ]
  pull_request:
    branches: [ "multiversion-26.1.2-26.2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v6
        with:
          name: BlackAddons-Mod
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
            !versions/*/build/libs/*-dev.jar

      - name: Upload Sources Jar
        uses: actions/upload-artifact@v6
        with:
          name: BlackAddons-Sources
          path: 'versions/*/build/libs/*-sources.jar'
