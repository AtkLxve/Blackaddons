name: Release BlackAddons

permissions:
  contents: write
  pull-requests: read
  issues: read

on:
  push:
    branches:
      - "1.21.10"
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (stable)'
        required: true
        default: 'stable'
        type: choice
        options:
        - stable

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: get_version
        run: |
          VERSION=$(grep "mod_version" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - id: set-matrix
        run: |
          echo "matrix=[\"1.21.10\", \"1.21.11\"]" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.2.1'
          arguments: build -Pmod_version=${{ needs.setup.outputs.version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.branch }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download New Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Nightly Release Logic
      - name: Fetch Previous Nightly Assets (If Push)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous_assets
          gh release download nightly --dir previous_assets --pattern "*.jar" || echo "No existing nightly release found."
          
          echo "Merging artifacts..."
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Current Pushed Branch: $BRANCH_NAME"
          
          # Remove old assets for ALL branches in the matrix from previous_assets
          echo '${{ needs.setup.outputs.matrix }}' | jq -r '.[]' | while read branch; do
            find previous_assets -name "*$branch*" -delete
          done
          
          # Move remaining (unrelated branch) assets to artifacts/ folder to be re-uploaded
          cp -n previous_assets/*.jar artifacts/ || true
          
          echo "Final artifacts to publish:"
          ls -R artifacts/

      - name: Update Nightly Release
        if: github.event_name == 'push'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "Nightly Build"
          files: artifacts/*.jar

      # Stable Release (Manual Dispatch)
      - name: Build Changelog
        if: github.event_name == 'workflow_dispatch'
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          ignorePreReleases: true
          toTag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        if: github.event_name == 'workflow_dispatch'
        id: get_version
        run: |
          VERSION=${{ needs.setup.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current version is $VERSION"

      - name: Create Stable Release
        if: github.event_name == 'workflow_dispatch'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "v${{ env.VERSION }}"
          prerelease: false
          title: "v${{ env.VERSION }}"
          body: "${{ steps.changelog.outputs.changelog }}"
          files: artifacts/*.jar

      - name: Bump Version
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/bump_version.py
        
      - name: Commit & Push Version Bump
        if: github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version"
          file_pattern: gradle.properties
