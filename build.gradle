plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'maven-publish'
    id 'dev.kikugie.stonecutter'
}

if (project == rootProject) {
    stonecutter {
        active "26.1.2"
    }
}

def versionProps = [
    "26.1.2": [
        minecraft: "26.1.2",
        loader: "0.19.3",
        fabric: "0.152.1+26.1.2",
        cloth_config: "26.1.154",
        modmenu: "18.0.0-beta.1",
        ias: "ve7VmwRr",
        //autoreauth: "b1XAh2Kn"
        //autoreauth is janky
    ],
    "26.2": [
        minecraft: "26.2",
        loader: "0.19.3",
        fabric: "0.152.2+26.2",
        cloth_config: "26.2.155",
        modmenu: "20.0.0-beta.3",
        ias: "fyfT98zh"
        //autoreauth: null
        //zzz
    ]
]

def currentStonecutterVersion = versionProps[stonecutter.current.version]

project.ext.minecraft_version = currentStonecutterVersion.minecraft
project.ext.loader_version = currentStonecutterVersion.loader
project.ext.fabric_version = currentStonecutterVersion.fabric
project.ext.cloth_config_version = currentStonecutterVersion.cloth_config
project.ext.modmenu_version = currentStonecutterVersion.modmenu
project.ext.ias_version = currentStonecutterVersion.ias
project.ext.autoreauth_version = currentStonecutterVersion.autoreauth
project.ext.jarvis_version = currentStonecutterVersion.jarvis

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_base_name}-${project.minecraft_version}"
}

loom {
    mods {
        "blackaddons" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "versions/${project.minecraft_version}/src/main/java"
        }
    }
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    mavenLocal()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://repo.hypixel.net/repository/Hypixel/" }
    maven { url "https://repo.nea.moe/releases/" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.gegy.dev/releases/" }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:1.13.11+kotlin.2.3.21"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    implementation "net.hypixel:mod-api:1.0.1"
    implementation "me.shedaniel.cloth:basic-math:0.6.1"

    if (project.jarvis_version != null) {
        implementation "moe.nea.jarvis:jarvis-fabric:${project.jarvis_version}"
    }

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    if (project.ias_version != null) {
        runtimeOnly "maven.modrinth:in-game-account-switcher:${project.ias_version}"
    }
    if (project.autoreauth_version != null) {
        runtimeOnly "maven.modrinth:auto-reauth:${project.autoreauth_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
